# echo-next ONLY overrides.
#
# Appended AFTER values-extended-env.yaml in echo-dev's valueFiles so these win
# for echo-next without touching prod/testing (which do not reference this file).
#
# Swaps all three LLM groups (multimodal pro, multimodal fast, text fast) and agent to
# Gemini 3.8 Flash on Vertex, EU-resident.
#
# Gemini 3.x is served in the EU multi-region on aiplatform.eu.rep.googleapis.com
# (v1beta1). The global host (aiplatform.googleapis.com) does not keep
# processing in the EU even with locations/eu in the path; Vertex reports that
# traffic as location=global.
#
# The api_base hardcodes project + model because litellm appends ":generateContent"
# to it verbatim. This file is echo-next-only, so the dembrane-echo project is correct.
# Each group falls back to 3.7 Flash (_1) and then 3.5 Flash (_2), in that order,
# only when the deployment before it errors or is cooling down after 429s.
common:
  env:
    LLM__MULTI_MODAL_PRO__MODEL: "vertex_ai/gemini-3.8-flash"
    LLM__MULTI_MODAL_PRO__VERTEX_LOCATION: "eu"
    LLM__MULTI_MODAL_PRO__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.8-flash"
    LLM__MULTI_MODAL_PRO_1__MODEL: "vertex_ai/gemini-3.7-flash"
    LLM__MULTI_MODAL_PRO_1__VERTEX_LOCATION: "eu"
    LLM__MULTI_MODAL_PRO_1__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.7-flash"
    LLM__MULTI_MODAL_PRO_2__MODEL: "vertex_ai/gemini-3.5-flash"
    LLM__MULTI_MODAL_PRO_2__VERTEX_LOCATION: "eu"
    LLM__MULTI_MODAL_PRO_2__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.5-flash"
    LLM__MULTI_MODAL_PRO_3__MODEL: ""
    LLM__MULTI_MODAL_PRO_3__VERTEX_LOCATION: ""

    LLM__MULTI_MODAL_FAST__MODEL: "vertex_ai/gemini-3.8-flash"
    LLM__MULTI_MODAL_FAST__VERTEX_LOCATION: "eu"
    LLM__MULTI_MODAL_FAST__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.8-flash"
    LLM__MULTI_MODAL_FAST_1__MODEL: "vertex_ai/gemini-3.7-flash"
    LLM__MULTI_MODAL_FAST_1__VERTEX_LOCATION: "eu"
    LLM__MULTI_MODAL_FAST_1__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.7-flash"
    LLM__MULTI_MODAL_FAST_2__MODEL: "vertex_ai/gemini-3.5-flash"
    LLM__MULTI_MODAL_FAST_2__VERTEX_LOCATION: "eu"
    LLM__MULTI_MODAL_FAST_2__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.5-flash"
    LLM__MULTI_MODAL_FAST_3__MODEL: ""
    LLM__MULTI_MODAL_FAST_3__VERTEX_LOCATION: ""

    LLM__TEXT_FAST__MODEL: "vertex_ai/gemini-3.8-flash"
    LLM__TEXT_FAST__VERTEX_LOCATION: "eu"
    LLM__TEXT_FAST__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.8-flash"
    LLM__TEXT_FAST_1__MODEL: "vertex_ai/gemini-3.7-flash"
    LLM__TEXT_FAST_1__VERTEX_LOCATION: "eu"
    LLM__TEXT_FAST_1__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.7-flash"
    LLM__TEXT_FAST_2__MODEL: "vertex_ai/gemini-3.5-flash"
    LLM__TEXT_FAST_2__VERTEX_LOCATION: "eu"
    LLM__TEXT_FAST_2__API_BASE: "https://aiplatform.eu.rep.googleapis.com/v1beta1/projects/dembrane-echo/locations/eu/publishers/google/models/gemini-3.5-flash"
    LLM__TEXT_FAST_3__MODEL: ""
    LLM__TEXT_FAST_3__VERTEX_LOCATION: ""

    # AssemblyAI webhook mode (mirrors prod/testing). Switches dev transcription
    # from polling to webhook callbacks. Pairs with ASSEMBLYAI_WEBHOOK_SECRET in
    # the sealed secret — that secret MUST hold a real dev value before this is
    # applied, or signed callbacks are rejected.
    ASSEMBLYAI_WEBHOOK_URL: "https://api.echo-next.dembrane.com/api/webhooks/assemblyai"

    # Self-serve billing (Mollie). Public URL Mollie POSTs payment status to;
    # path is the FastAPI route /api/v2/billing/mollie/webhook. The MOLLIE_API_KEY
    # itself is a sealed secret (echo-backend-secrets), not set here. Pair this
    # with a test_ key in dev so Mollie runs in test mode.
    MOLLIE_WEBHOOK_URL: "https://api.echo-next.dembrane.com/api/v2/billing/mollie/webhook"

    # Support-request forwarding to sam (ISSUE-034): sam's public edge
    # function, which fronts sam's private /echo/support-webhook receiver.
    # OUTBOUND (the server's forwarder POSTs to it) — nothing about this env
    # receives traffic here. The ECHO_SUPPORT_WEBHOOK_TOKEN it pairs with is
    # a sealed secret (echo-backend-secrets), not set here. Same URL in prod;
    # the payload's environment field distinguishes the sender.
    SUPPORT_WEBHOOK_URL: "https://europe-west1-dembrane-sameer-cli.cloudfunctions.net/echo-support-webhook-proxy"

agent:
  env:
    LLM_MODEL: "gemini-3.8-flash"
    LLM_FALLBACK_MODELS: "gemini-3.7-flash,gemini-3.5-flash"
    # Graph steps, two per tool round. The agent stops repeated calls itself,
    # so this only ends a runaway turn (echo #1100).
    AGENT_GRAPH_RECURSION_LIMIT: "320"
    VERTEX_API_ENDPOINT: "aiplatform.eu.rep.googleapis.com"

# Four CPU workers at 1.5Gi each fill the dev nodes, so no deployment has room
# to surge and rollouts stall. One keeps the queue moving on echo-next.
workerCpu:
  maxReplicaCount: 1

# The dev nodes run near their memory limit; the ticks worker asks for little so
# it can still be scheduled next to a CPU-worker scale-up.
workerTicks:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1536Mi"
