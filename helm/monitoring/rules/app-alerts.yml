# Production alerts. Every alert that is posted carries what a person needs without knowing the
# cluster: title (the thing and what happened to it), summary (what happened, with the
# numbers), impact (who feels it), action (the first step) and link (the one page to open).
# The Slack message is made of those (alertmanager/alertmanager.yml). They name no rule,
# queue or job, and say only what was seen to be true.
#
# severity critical: someone is affected now; the channel is tagged and the message repeats.
# severity notice:   nobody is affected yet; posted once, no tag.
# severity warning:  not posted; counted in the weekly digest.
#
# rules/app-alerts.test.yml replays these rules on example series: run
#   promtool test rules helm/monitoring/rules/app-alerts.test.yml
#
# Every kube-state-metrics series is reduced to one per pod and container (or per
# deployment) before it is joined or counted. After kube-state-metrics and Prometheus
# restart together each object has two series for five minutes; a join on them fails and
# a sum counts double.
groups:
  - name: monitoring-storage
    rules:
      - alert: MonitoringStorageLow
        expr: |
          min by (persistentvolumeclaim) (kubelet_volume_stats_available_bytes{namespace="monitoring", persistentvolumeclaim=~"loki-data|prometheus-data|grafana-data"})
          / max by (persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim=~"loki-data|prometheus-data|grafana-data"}) < 0.20
        for: 10m
        labels:
          severity: notice
          component: monitoring
        annotations:
          title: 'Production monitoring storage is running low'
          summary: '{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} of its disk space free.'
          impact: 'Nothing is lost yet. If the disk fills, new monitoring history can stop being stored before the 200-day retention target.'
          action: 'Expand this claim in helm/monitoring/values-prod.yaml, merge and sync. Keep existing history; do not shorten retention to hide the warning.'
          link: 'https://grafana.dembrane.com/d/v3-overview'

      - alert: MonitoringStorageFillingSoon
        expr: |
          predict_linear((min by (persistentvolumeclaim) (kubelet_volume_stats_available_bytes{namespace="monitoring", persistentvolumeclaim=~"loki-data|prometheus-data|grafana-data"}))[6h:5m], 7 * 24 * 3600) < 0
          and on (persistentvolumeclaim)
          (min by (persistentvolumeclaim) (kubelet_volume_stats_available_bytes{namespace="monitoring", persistentvolumeclaim=~"loki-data|prometheus-data|grafana-data"})
          / max by (persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim=~"loki-data|prometheus-data|grafana-data"}) < 0.50)
        for: 1h
        labels:
          severity: notice
          component: monitoring
        annotations:
          title: 'Production monitoring storage may fill this week'
          summary: '{{ $labels.persistentvolumeclaim }} is predicted to fill within seven days if the last six hours of growth continue.'
          impact: 'New logs or metrics can stop being stored when the disk is full. This forecast is an estimate, not a confirmed data loss.'
          action: 'Check recent growth, then expand this claim in helm/monitoring/values-prod.yaml before it fills.'
          link: 'https://grafana.dembrane.com/d/v3-overview'

      - alert: MonitoringStorageCritical
        expr: |
          min by (persistentvolumeclaim) (kubelet_volume_stats_available_bytes{namespace="monitoring", persistentvolumeclaim=~"loki-data|prometheus-data|grafana-data"})
          / max by (persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim=~"loki-data|prometheus-data|grafana-data"}) < 0.05
        for: 5m
        labels:
          severity: critical
          component: monitoring
        annotations:
          title: 'Production monitoring storage is almost full'
          summary: '{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} of its disk space free.'
          impact: 'New monitoring history is at immediate risk. Customer recordings use different storage and are not measured by this alert.'
          action: 'Expand this claim now in helm/monitoring/values-prod.yaml and sync. Check whether Loki or Prometheus has already stopped writing.'
          link: 'https://grafana.dembrane.com/d/v3-overview'

      - alert: MonitoringStorageMetricsMissing
        expr: |
          absent(kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim="loki-data"})
          or absent(kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim="prometheus-data"})
          or absent(kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim="grafana-data"})
        for: 15m
        labels:
          severity: notice
          component: monitoring
        annotations:
          title: 'Production monitoring storage checks are missing'
          summary: 'No disk-capacity metric is arriving for {{ $labels.persistentvolumeclaim }}.'
          impact: 'Low-space alerts cannot be trusted for this disk until its metrics return. Missing data does not mean the disk is healthy.'
          action: 'Check the kubernetes-nodes scrape targets and kubelet volume metrics, then confirm capacity and free space appear in Prometheus.'
          link: 'https://grafana.dembrane.com/d/v3-overview'

  - name: work
    rules:
      # The worker writes each queue's depth to its log once a minute; promtail turns the
      # lines into the dembrane_queue_* series (templates/configmap-promtail.yaml).
      - alert: TranscriptionWaiting
        expr: max(dembrane_queue_oldest_ready_seconds{queue="conversations.chunk"}) > 120
        for: 3m
        labels:
          severity: critical
          component: worker
        annotations:
          title: 'Production transcription is waiting'
          summary: '{{ with query "max(dembrane_queue_ready{queue=''conversations.chunk''})" }}{{ . | first | value | printf "%.0f" }}{{ end }} pieces of audio wait to be transcribed, the oldest for {{ $value | humanizeDuration }}.'
          impact: 'People who record now see no transcript appear. Nothing is lost: the audio is stored and is transcribed in order once the queue moves.'
          action: 'Check that the workers are up and not restarting, then look for failed jobs in the worker log.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: JobsWaiting
        expr: max by (queue) (dembrane_queue_oldest_ready_seconds{queue!="conversations.chunk"}) > 900
        for: 5m
        labels:
          severity: notice
          component: worker
        annotations:
          title: 'Production background work is late'
          summary: 'In one queue the oldest job has waited {{ $value | humanizeDuration }}.'
          impact: 'Summaries, reports, emails or analysis arrive late, depending on the queue. Recording and transcription are not affected.'
          action: 'See which queue it is on the dashboard, then look for a failing job in the worker log before adding workers.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      # A worker that restarts counts as available between two restarts, so this reads the
      # average over ten minutes and not the value of the moment.
      - alert: WorkersDown
        expr: |
          max by (deployment) (avg_over_time(kube_deployment_status_replicas_available{namespace="dembrane-web-prod", deployment="dembrane-web-worker"}[10m]))
            / max by (deployment) (avg_over_time(kube_deployment_spec_replicas{namespace="dembrane-web-prod", deployment="dembrane-web-worker"}[10m])) < 0.5
        labels:
          severity: critical
          component: worker
        annotations:
          title: 'Production workers are down'
          summary: 'On average {{ with query "max(avg_over_time(kube_deployment_status_replicas_available{namespace=''dembrane-web-prod'', deployment=''dembrane-web-worker''}[10m]))" }}{{ . | first | value | printf "%.1f" }}{{ end }} of {{ with query "max(kube_deployment_spec_replicas{namespace=''dembrane-web-prod'', deployment=''dembrane-web-worker''})" }}{{ . | first | value | printf "%.0f" }}{{ end }} workers were up in the last 10 minutes.'
          impact: 'Transcription, summaries, reports, analysis and emails are slow or stopped. Recording still works and the audio is stored; the work waits in the queue and runs when the workers are back.'
          action: 'Find why they stop: the last state of a worker pod names the reason. Out of memory means its memory limit is too low.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      # The API answers 503 here when no worker has checked in for 90 seconds. It is asked
      # from outside the workers, so it also catches a worker that hangs without restarting.
      - alert: WorkersSilent
        expr: probe_success{job="blackbox_http", svc="worker"} == 0
        for: 3m
        labels:
          severity: critical
          component: worker
        annotations:
          title: 'Production workers are silent'
          summary: 'No worker has checked in with the API for 3 minutes.'
          impact: 'Scheduled and background work is not running: transcription, summaries, reports and emails wait. Recording still works and the audio is stored.'
          action: 'Look at the worker pods and their log. A worker that cannot start says why in one line.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

  - name: application
    rules:
      - alert: OutOfMemory
        expr: |
          sum by (component) (
            label_replace(
              max by (pod, container) (kube_pod_container_status_last_terminated_reason{namespace="dembrane-web-prod", reason="OOMKilled"} == 1)
                * on (pod, container)
              max by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace="dembrane-web-prod"}[10m])),
              "component", "$1", "pod", "dembrane-web-([a-z]+)-.*")
          ) > 0
        labels:
          severity: critical
        annotations:
          title: 'Production {{ if eq $labels.component "api" }}API{{ else if eq $labels.component "portal" }}recording page{{ else if eq $labels.component "dashboard" }}app{{ else if eq $labels.component "media" }}audio conversion{{ else }}{{ $labels.component }}{{ end }} ran out of memory'
          summary: 'It was stopped {{ if eq (printf "%.0f" $value) "1" }}once{{ else }}{{ $value | printf "%.0f" }} times{{ end }} in the last 10 minutes for using more memory than its limit.'
          impact: '{{ if eq $labels.component "worker" }}The jobs it was running start again on another worker. If every worker stops this way, nothing is transcribed, summarised or emailed until one stays up; recording still works and the audio is stored.{{ else if eq $labels.component "api" }}The requests it was answering fail: people see errors in the app and on the recording page while it restarts.{{ else if eq $labels.component "media" }}The audio it was converting fails.{{ else if eq $labels.component "portal" }}Participants get errors on the recording page while it restarts.{{ else }}People get errors in the app while it restarts.{{ end }}'
          action: 'Raise its memory limit in values-prod.yaml on the prod-v3 branch and sync, or find what grew: the dashboard shows memory for each part of the app.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: ContainerRestarting
        expr: |
          sum by (component) (
            label_replace(
              max by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace="dembrane-web-prod"}[10m])),
              "component", "$1", "pod", "dembrane-web-([a-z]+)-.*")
          ) >= 3
        labels:
          severity: critical
        annotations:
          title: 'Production {{ if eq $labels.component "api" }}API{{ else if eq $labels.component "portal" }}recording page{{ else if eq $labels.component "dashboard" }}app{{ else if eq $labels.component "media" }}audio conversion{{ else }}{{ $labels.component }}{{ end }} keeps restarting'
          summary: 'It restarted {{ $value | printf "%.0f" }} times in the last 10 minutes.'
          impact: '{{ if eq $labels.component "worker" }}Jobs in progress start again each time. If no worker stays up, nothing is transcribed, summarised or emailed; recording still works and the audio is stored.{{ else if eq $labels.component "api" }}People see errors in the app and on the recording page each time it restarts.{{ else if eq $labels.component "media" }}The audio it is converting fails each time.{{ else if eq $labels.component "portal" }}Participants get errors on the recording page each time it restarts.{{ else }}People get errors in the app each time it restarts.{{ end }}'
          action: 'Read why it stops: the log of its previous run and the last state of its pod.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: ServiceDown
        expr: max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace="dembrane-web-prod", deployment=~"dembrane-web-(api|media|dashboard|portal)"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          title: 'Production {{ if eq $labels.deployment "dembrane-web-api" }}API{{ else if eq $labels.deployment "dembrane-web-portal" }}recording page{{ else if eq $labels.deployment "dembrane-web-dashboard" }}app{{ else if eq $labels.deployment "dembrane-web-media" }}audio conversion{{ else }}workers{{ end }} is down'
          summary: 'No instance of it has been running for 2 minutes.'
          impact: '{{ if eq $labels.deployment "dembrane-web-api" }}The app and the recording page do not work: nobody can sign in, open a project or record.{{ else if eq $labels.deployment "dembrane-web-portal" }}Participants cannot open the recording page.{{ else if eq $labels.deployment "dembrane-web-dashboard" }}Nobody can open the app.{{ else }}Audio cannot be converted, so uploaded audio files and merged recordings are not made.{{ end }}'
          action: 'Look at its pods: a failed start, a missing image or a full node shows in their state.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: ServiceShort
        expr: |
          (
            max by (deployment) (kube_deployment_spec_replicas{namespace="dembrane-web-prod", deployment=~"dembrane-web-(api|worker|media|dashboard|portal)"})
          - max by (deployment) (kube_deployment_status_replicas_available{namespace="dembrane-web-prod", deployment=~"dembrane-web-(api|worker|media|dashboard|portal)"})
          ) > 0
        for: 10m
        labels:
          severity: notice
        annotations:
          title: 'Production {{ if eq $labels.deployment "dembrane-web-api" }}API{{ else if eq $labels.deployment "dembrane-web-portal" }}recording page{{ else if eq $labels.deployment "dembrane-web-dashboard" }}app{{ else if eq $labels.deployment "dembrane-web-media" }}audio conversion{{ else }}workers{{ end }} runs short'
          summary: 'It has run with {{ if eq (printf "%.0f" $value) "1" }}one instance{{ else }}{{ $value | printf "%.0f" }} instances{{ end }} too few for 10 minutes.'
          impact: 'Nobody is affected while the others cope; there is less room for a busy moment and none for another failure.'
          action: 'Look at its pods: one that cannot be placed needs a node, one that restarts has its reason in its last state.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: MemoryNearLimit
        expr: |
          max by (component) (
            label_replace(
              max by (pod, container) (max_over_time(container_memory_working_set_bytes{namespace="dembrane-web-prod", container!="", image!=""}[15m]))
                / on (pod, container)
              max by (pod, container) (kube_pod_container_resource_limits{namespace="dembrane-web-prod", resource="memory"}),
              "component", "$1", "pod", "dembrane-web-([a-z]+)-.*")
          ) > 0.85
        labels:
          severity: notice
        annotations:
          title: 'Production {{ if eq $labels.component "api" }}API{{ else if eq $labels.component "portal" }}recording page{{ else if eq $labels.component "dashboard" }}app{{ else if eq $labels.component "media" }}audio conversion{{ else }}{{ $labels.component }}{{ end }} is close to its memory limit'
          summary: 'It used {{ $value | humanizePercentage }} of its limit in the last 15 minutes.'
          impact: 'Nobody is affected yet. Above the limit it is stopped and restarts, and what it was doing fails or starts again.'
          action: 'Raise its memory limit in values-prod.yaml on the prod-v3 branch before it is reached, or find what grew.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: SiteUnreachable
        expr: probe_success{job="blackbox_http", svc!="worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          title: 'Production {{ if eq $labels.svc "portal" }}recording page{{ else if eq $labels.svc "dashboard" }}app{{ else }}API{{ end }} does not answer'
          summary: 'It has not answered from outside for 2 minutes.'
          impact: '{{ if eq $labels.svc "portal" }}Participants cannot open the recording page.{{ else if eq $labels.svc "dashboard" }}Nobody can open the app.{{ else }}The app and the recording page cannot reach the API: nobody can sign in, open a project or record.{{ end }}'
          action: 'Open the address yourself. If it fails for you too: the ingress, the certificate and DNS. If only the API fails: its pods and the database.'
          link: '{{ $labels.instance }}'

      # The check accepts any certificate (so a broken one still counts as answering), which
      # is why the expiry date is read here. A probe that fails before the handshake reports 0
      # and is left out. The notice stops at 3 days, where the critical alert takes over.
      - alert: CertificateExpiresSoon
        expr: |
          (probe_ssl_earliest_cert_expiry{job="blackbox_http", svc=~"api|dashboard|portal"} > 0) - time() < 14 * 86400
          and
          (probe_ssl_earliest_cert_expiry{job="blackbox_http", svc=~"api|dashboard|portal"} > 0) - time() >= 3 * 86400
        for: 1h
        labels:
          severity: notice
        annotations:
          title: 'Production {{ if eq $labels.svc "portal" }}recording page{{ else if eq $labels.svc "dashboard" }}app{{ else }}API{{ end }} certificate expires soon'
          summary: 'Its certificate expires in {{ $value | humanizeDuration }}.'
          impact: 'Nobody is affected yet. After it expires, people see a browser warning and cannot open the {{ if eq $labels.svc "portal" }}recording page{{ else }}app{{ end }}.'
          action: 'Check that the certificate was renewed and that the ingress serves the new one. Renewal normally happens weeks before, so this means it is stuck.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: CertificateAboutToExpire
        expr: |
          (probe_ssl_earliest_cert_expiry{job="blackbox_http", svc=~"api|dashboard|portal"} > 0) - time() < 3 * 86400
        for: 5m
        labels:
          severity: critical
        annotations:
          title: 'Production {{ if eq $labels.svc "portal" }}recording page{{ else if eq $labels.svc "dashboard" }}app{{ else }}API{{ end }} certificate {{ if gt $value 0.0 }}is about to expire{{ else }}has expired{{ end }}'
          summary: '{{ if gt $value 0.0 }}Its certificate expires in {{ $value | humanizeDuration }}.{{ else }}Its certificate is past its end date.{{ end }}'
          impact: '{{ if gt $value 0.0 }}Once it expires, people{{ else }}People{{ end }} see a browser warning and cannot open the {{ if eq $labels.svc "portal" }}recording page{{ else }}app{{ end }}.'
          action: 'Check that the certificate was renewed and that the ingress serves the new one. Renew it by hand if it is stuck.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: IngressHighErrorRate
        expr: (sum by (svc)( label_replace(rate({__name__=~"nginx_ingress_controller_requests(_total)?",status=~"5..",namespace="dembrane-web-prod"}[5m]), "svc", "$1", "exported_service", "(.*)") or label_replace(rate({__name__=~"nginx_ingress_controller_requests(_total)?",status=~"5..",namespace="dembrane-web-prod"}[5m]), "svc", "$1", "service", "(.*)") ) ) / (sum by (svc)( label_replace(rate({__name__=~"nginx_ingress_controller_requests(_total)?",namespace="dembrane-web-prod"}[5m]), "svc", "$1", "exported_service", "(.*)") or label_replace(rate({__name__=~"nginx_ingress_controller_requests(_total)?",namespace="dembrane-web-prod"}[5m]), "svc", "$1", "service", "(.*)") ) ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | humanizePercentage }} of requests to {{ $labels.svc | reReplaceAll "dembrane-web-" "" }} fail'

      - alert: IngressCriticalErrorRate
        expr: (sum by (svc)( label_replace(rate({__name__=~"nginx_ingress_controller_requests(_total)?",status=~"5..",namespace="dembrane-web-prod"}[5m]), "svc", "$1", "exported_service", "(.*)") or label_replace(rate({__name__=~"nginx_ingress_controller_requests(_total)?",status=~"5..",namespace="dembrane-web-prod"}[5m]), "svc", "$1", "service", "(.*)") ) ) / (sum by (svc)( label_replace(rate({__name__=~"nginx_ingress_controller_requests(_total)?",namespace="dembrane-web-prod"}[5m]), "svc", "$1", "exported_service", "(.*)") or label_replace(rate({__name__=~"nginx_ingress_controller_requests(_total)?",namespace="dembrane-web-prod"}[5m]), "svc", "$1", "service", "(.*)") ) ) > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          title: 'Production {{ if eq $labels.svc "dembrane-web-portal" }}recording page{{ else if eq $labels.svc "dembrane-web-api" }}API{{ else }}{{ $labels.svc | reReplaceAll "dembrane-web-" "" }}{{ end }} is failing requests'
          summary: '{{ $value | humanizePercentage }} of the requests to it failed in the last 5 minutes.'
          impact: '{{ if eq $labels.svc "dembrane-web-portal" }}Participants get errors on the recording page.{{ else }}People get errors in the app: pages do not load or changes are not saved.{{ end }}'
          action: 'Read the API log for errors (every line has a request id) and check the database.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      # The dashboard holds live streams open, so it is left out of the latency rules.
      - alert: IngressHighLatencyP95
        expr: histogram_quantile(0.95, sum by (svc, le) ( label_replace(rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace="dembrane-web-prod", service!="dembrane-web-dashboard", exported_service!="dembrane-web-dashboard"}[5m]), "svc", "$1", "exported_service", "(.*)") or label_replace(rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace="dembrane-web-prod", service!="dembrane-web-dashboard", exported_service!="dembrane-web-dashboard"}[5m]), "svc", "$1", "service", "(.*)") ) ) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '1 in 20 requests to {{ $labels.svc | reReplaceAll "dembrane-web-" "" }} takes longer than {{ $value | humanizeDuration }}'

      - alert: IngressCriticalLatencyP95
        expr: histogram_quantile(0.95, sum by (svc, le) ( label_replace(rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace="dembrane-web-prod", service!="dembrane-web-dashboard", exported_service!="dembrane-web-dashboard"}[5m]), "svc", "$1", "exported_service", "(.*)") or label_replace(rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace="dembrane-web-prod", service!="dembrane-web-dashboard", exported_service!="dembrane-web-dashboard"}[5m]), "svc", "$1", "service", "(.*)") ) ) > 3
        for: 10m
        labels:
          severity: critical
        annotations:
          title: 'Production {{ if eq $labels.svc "dembrane-web-portal" }}recording page{{ else if eq $labels.svc "dembrane-web-api" }}API{{ else }}{{ $labels.svc | reReplaceAll "dembrane-web-" "" }}{{ end }} is slow'
          summary: '1 in 20 requests to it takes longer than {{ $value | humanizeDuration }}.'
          impact: '{{ if eq $labels.svc "dembrane-web-portal" }}The recording page loads slowly for participants.{{ else }}The app feels slow or stuck for everyone using it.{{ end }}'
          action: 'Look for slow database queries and busy API pods.'
          link: 'https://grafana.dembrane.com/d/v3-errors'

      - alert: HighContainerCPUUtilization
        expr: ( sum by (pod, namespace)(rate(container_cpu_usage_seconds_total{namespace="dembrane-web-prod", image!="", container!=""}[5m])) ) / clamp_min(sum by (pod, namespace)(kube_pod_container_resource_requests{namespace="dembrane-web-prod", resource="cpu", unit="core", container!=""}), 0.1) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }} uses more CPU than it asked for"

  - name: pipeline
    rules:
      # Always fires, to show that rules are evaluated and Alertmanager receives them.
      # Routed nowhere; a check from outside can read it from the Alertmanager API.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline is alive"
