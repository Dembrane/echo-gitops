apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
    
    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
          # The worker writes each queue's depth once a minute and a heartbeat line; both
          # become metrics here, so an alert can say how much work waits and for how long.
          # The queue name is a label only while the metrics are made: the stream that goes
          # to Loki keeps its labels.
          # The selectors keep their escaped quotes: this promtail refuses a backtick string
          # in a match stage and then does not start.
          - match:
              selector: '{namespace="dembrane-web-prod", container="worker"} |= "\"signal\":\"queue.depth\""'
              stages:
                - json:
                    expressions:
                      queue: name
                      ready: ready
                      active: active
                      oldest_ready_s: oldestReadyS
                - template:
                    source: oldest_ready_s
                    template: '{{ "{{" }} if .Value {{ "}}" }}{{ "{{" }} .Value {{ "}}" }}{{ "{{" }} else {{ "}}" }}0{{ "{{" }} end {{ "}}" }}'
                - labels:
                    queue:
                - metrics:
                    queue_ready:
                      type: Gauge
                      description: Jobs waiting in the queue
                      prefix: dembrane_
                      source: ready
                      max_idle_duration: 3m
                      config:
                        action: set
                    queue_active:
                      type: Gauge
                      description: Jobs running
                      prefix: dembrane_
                      source: active
                      max_idle_duration: 3m
                      config:
                        action: set
                    queue_oldest_ready_seconds:
                      type: Gauge
                      description: How long the oldest waiting job has waited
                      prefix: dembrane_
                      source: oldest_ready_s
                      max_idle_duration: 3m
                      config:
                        action: set
                - labeldrop:
                    - queue
          - match:
              selector: '{namespace="dembrane-web-prod", container="worker"} |= "\"signal\":\"worker.heartbeat\""'
              stages:
                - metrics:
                    worker_heartbeats_total:
                      type: Counter
                      description: Heartbeat jobs a worker ran
                      prefix: dembrane_
                      max_idle_duration: 1h
                      config:
                        match_all: true
                        action: inc
        relabel_configs:
          # Only keep pods that are scheduled on this node (each Promtail scrapes its own host)
          - action: keep
            source_labels: [__meta_kubernetes_pod_node_name]
            regex: ${HOSTNAME}
          - source_labels: [__meta_kubernetes_pod_controller_name]
            regex: ([0-9a-z-.]+)(-[0-9a-f]{8,10})?
            action: replace
            target_label: __tmp_controller_name
          # Set a stable 'app' label preferring app.kubernetes.io/name, then app, then controller name
          - action: replace
            source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
            regex: (.+)
            replacement: $1
          - action: replace
            source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
            regex: (.+)
            replacement: $1
          - action: replace
            source_labels: [__tmp_controller_name]
            target_label: app
            regex: (.+)
            replacement: $1
          # Set a stable 'component' label preferring app.kubernetes.io/component, then component
          - action: replace
            source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
            regex: (.+)
            replacement: $1
          - action: replace
            source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
            regex: (.+)
            replacement: $1
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: node
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - action: replace
            replacement: $1
            separator: /
            source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_name
            target_label: pod
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: instance
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
          # Explicit pod log path under /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
          # Use UID-only pattern so container dir and rotation filenames are matched
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_uid
            target_label: __path__
            replacement: /var/log/pods/*$1/*/*.log
          - source_labels: [__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash]
            action: replace
            replacement: true
            target_label: __kubernetes_logs_annotationpresent_kubernetes_io_config_hash 