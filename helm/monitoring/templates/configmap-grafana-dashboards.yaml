apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
  annotations:
    # Replaced, not patched: a patch copies the whole object into an annotation that may
    # hold 262144 bytes, and the dashboards together are larger than that.
    argocd.argoproj.io/sync-options: Replace=true
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  kubernetes-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "title": "Cluster CPU Usage",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(process_cpu_seconds_total[5m])) by (namespace)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 0,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "title": "Ready Pods by Namespace",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"}) by (namespace)",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Kubernetes Overview",
      "uid": "kubernetes-overview",
      "version": 1,
      "weekStart": ""
    }
  node-exporter-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 1860,
      "title": "Node Exporter Full",
      "uid": "node-exporter-full",
      "version": 1,
      "panels": [
        {
          "title": "Node CPU Usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(process_cpu_seconds_total[5m])) by (instance)",
              "legendFormat": "CPU Usage - {{ "{{" }}instance{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            }
          }
        },
        {
          "title": "Memory Usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "process_resident_memory_bytes",
              "legendFormat": "Memory - {{ "{{" }}instance{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "title": "Node Status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "kube_node_status_condition{condition=\"Ready\", status=\"true\"}",
              "legendFormat": "Node Ready - {{ "{{" }}node{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            }
          }
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["node-exporter"]
    }
  nginx-ingress-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 9614,
      "title": "Nginx Ingress Controller",
      "uid": "nginx-ingress",
      "version": 1,
      "panels": [
        {
          "title": "Pod Status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "kube_pod_status_phase{namespace=\"ingress-nginx\", phase=\"Running\"}",
              "legendFormat": "Running Pods"
            }
          ]
        },
        {
          "title": "Controller CPU Usage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"ingress-nginx\", container=\"controller\"}[5m]))",
              "legendFormat": "CPU Usage"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            }
          }
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["nginx"]
    }
  loki-logs-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 12019,
      "title": "Loki Logs",
      "uid": "loki-logs",
      "version": 1,
      "panels": [
        {
          "title": "Log Volume",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(loki_distributor_bytes_received_total[5m])) by (tenant)",
              "legendFormat": "Log Volume"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "title": "Logs by Namespace",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "{namespace=~\".+\"}"
            }
          ]
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["loki", "logs"]
    }
  # The dembrane v3 dashboards are JSON files in dashboards/. __NAMESPACE__ in them becomes the
  # namespace their Namespace variable prefers and always offers.
  v3-overview.json: |
{{ .Files.Get "dashboards/v3-overview.json" | replace "__NAMESPACE__" .Values.dashboards.namespace | trim | indent 4 }}
  v3-worker-jobs.json: |
{{ .Files.Get "dashboards/v3-worker-jobs.json" | replace "__NAMESPACE__" .Values.dashboards.namespace | trim | indent 4 }}
  v3-product.json: |
{{ .Files.Get "dashboards/v3-product.json" | trim | indent 4 }}
  v3-ai.json: |
{{ .Files.Get "dashboards/v3-ai.json" | trim | indent 4 }}
{{- /* sam, the team's agent: its own database behind the data source "dembrane sam". */}}
{{- range .Values.obs.environments }}
{{- if eq .name "sam" }}
  sam.json: |
{{ $.Files.Get "dashboards/sam.json" | trim | indent 4 }}
{{- end }}
{{- end }}
{{- if .Values.google.environments }}
  v3-staging-previews.json: |
{{ .Files.Get "dashboards/v3-staging-previews.json" | trim | indent 4 }}
{{- end }}
