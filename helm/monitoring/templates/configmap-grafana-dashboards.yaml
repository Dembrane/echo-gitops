apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
  annotations:
    # Replaced, not patched: a patch copies the whole object into an annotation that may
    # hold 262144 bytes, and the dashboards together are larger than that.
    argocd.argoproj.io/sync-options: Replace=true
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  v3-overview.json: |
{{ .Files.Get "dashboards/v3-overview.json" | replace "__NAMESPACE__" .Values.dashboards.namespace | trim | indent 4 }}
  v3-worker-jobs.json: |
{{ .Files.Get "dashboards/v3-worker-jobs.json" | replace "__NAMESPACE__" .Values.dashboards.namespace | trim | indent 4 }}
  v3-product.json: |
{{ .Files.Get "dashboards/v3-product.json" | trim | indent 4 }}
{{- range .Values.obs.environments }}
{{- if eq .name "prod" }}
  v3-customers.json: |
{{ $.Files.Get "dashboards/v3-customers.json" | trim | indent 4 }}
{{- end }}
{{- end }}
  v3-ai.json: |
{{ .Files.Get "dashboards/v3-ai.json" | trim | indent 4 }}
  # What is going wrong: only failures, of every layer and environment. It has no dropdown;
  # __NAMESPACE__ becomes the namespace its production rows read.
  v3-errors.json: |
{{ .Files.Get "dashboards/v3-errors.json" | replace "__NAMESPACE__" .Values.dashboards.namespace | trim | indent 4 }}
{{- /* sam, the team's agent: its own database behind the data source "dembrane sam". */}}
{{- range .Values.obs.environments }}
{{- if eq .name "sam" }}
  sam.json: |
{{ $.Files.Get "dashboards/sam.json" | trim | indent 4 }}
  # Why a request to sam takes as long as it does: model turns, call latency, tool time, one session's timeline.
  sam-performance.json: |
{{ $.Files.Get "dashboards/sam-performance.json" | trim | indent 4 }}
{{- end }}
{{- end }}
{{- if .Values.google.environments }}
  v3-staging-previews.json: |
{{ .Files.Get "dashboards/v3-staging-previews.json" | trim | indent 4 }}
{{- end }}
