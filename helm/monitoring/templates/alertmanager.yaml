{{- /* alerting.titlePrefix names the environment in each Slack title (EU: ...) when two
clusters post to one channel; production leaves it empty. */ -}}
{{- $alertmanager := .Files.Get "alertmanager/alertmanager.yml" | replace "__TITLE_PREFIX__" ((.Values.alerting).titlePrefix | default "") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  # A plain file, so amtool can check it and its braces need no escaping.
  alertmanager.yml: |
{{ $alertmanager | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        checksum/config: {{ $alertmanager | sha256sum }}
    spec:
      {{- include "monitoring.nodeSelector" . | nindent 6 }}
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.26.0
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: alertmanager-secrets
              mountPath: /etc/alertmanager/secrets
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
        - name: alertmanager-secrets
          secret:
            secretName: monitoring-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http


