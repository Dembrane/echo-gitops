{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    {{- /*
      Built as one dict so a key can never be emitted twice. Before this, the
      hardcoded defaults below and the `ingress.annotations` range both wrote
      cert-manager.io/cluster-issuer and nginx.ingress.kubernetes.io/ssl-redirect,
      producing a duplicate-key Ingress. Values win over the defaults here.
    */}}
    {{- $ann := dict
          "kubernetes.io/ingress.class" .Values.ingress.className
          "cert-manager.io/cluster-issuer" .Values.clusterIssuerName
          "nginx.ingress.kubernetes.io/ssl-redirect" "true" }}
    {{- if .Values.ingress.basicAuth.enabled }}
    {{- $_ := set $ann "nginx.ingress.kubernetes.io/auth-type" "basic" }}
    {{- $_ := set $ann "nginx.ingress.kubernetes.io/auth-secret" "monitoring-basic-auth" }}
    {{- $_ := set $ann "nginx.ingress.kubernetes.io/auth-realm" "Authentication Required" }}
    {{- end }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{- $_ := set $ann $key $value }}
    {{- end }}
    {{- range $key, $value := $ann }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  tls:
    - hosts:
        - grafana.{{ .Values.domain }}
        - prometheus.{{ .Values.domain }}
      secretName: monitoring-tls
  rules:
    - host: grafana.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    - host: prometheus.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
{{- end }}
