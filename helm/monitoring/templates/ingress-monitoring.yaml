{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuerName }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- if .Values.ingress.basicAuth.enabled }}
    # Basic auth protection
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    {{- end }}
    {{- /* The issuer and redirect are set above; repeating them from values renders duplicate keys. */}}
    {{- range $key, $value := omit .Values.ingress.annotations "cert-manager.io/cluster-issuer" "nginx.ingress.kubernetes.io/ssl-redirect" }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  tls:
    - hosts:
        - grafana.{{ .Values.domain }}
        {{- if .Values.ingress.prometheusHost }}
        - prometheus.{{ .Values.domain }}
        {{- end }}
      secretName: monitoring-tls
  rules:
    - host: grafana.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    {{- if .Values.ingress.prometheusHost }}
    - host: prometheus.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
    {{- end }}
{{- end }}
