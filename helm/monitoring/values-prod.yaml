# Production configuration for the monitoring stack
clusterIssuerName: "letsencrypt-prod"
domain: "dembrane.com"  # Production domain

# Storage settings
storage:
  storageClassName: "do-block-storage"
  prometheus:
    size: "20Gi"
  loki:
    size: "20Gi"
  grafana:
    size: "10Gi"

# Prometheus settings
prometheus:
  extraArgs:
    - --query.max-concurrency=40
    - --web.max-connections=1024
    - --query.timeout=2m
    - --query.max-samples=100000000
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "4Gi"

# Grafana settings
grafana:
  # This will be overridden by the SealedSecret in production
  adminPassword: "admin"
  resources:
    requests:
      cpu: "200m"
      memory: "750Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Loki settings
loki:
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# Promtail settings
promtail:
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "400m"
      memory: "512Mi"

# Ingress settings - Enable public access via NGINX and TLS
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # Prometheus is read through Grafana and from inside the cluster; true adds its own host.
  prometheusHost: false
  basicAuth:
    enabled: false 

# HTTP Blackbox checks (prod)
httpChecks:
  interval: 30s
  timeout: 5s
  targets:
    - name: api
      url: https://api.dembrane.com/api/health
    - name: ready
      url: https://api.dembrane.com/ready
    - name: dashboard
      url: https://dashboard.dembrane.com/
    - name: portal
      url: https://portal.dembrane.com/

# Dashboards (env-specific variables injected into configmap-grafana-dashboards)
dashboards:
  namespace: "dembrane-web-prod"
# Product dashboards: prod reads its own database; staging (Google Cloud SQL) through the
# Cloud SQL Auth proxy sidecar on localhost, so its OBS_STAGING_DB_HOST is 127.0.0.1:5433 and
# it needs no TLS of its own. Both use the read-only role of sql/grafana-obs-role.sql. Hosts,
# names, users and passwords live in the secret grafana-obs-db (see values.yaml).
obs:
  environments:
    - name: prod
      sslmode: require
    - name: staging
      sslmode: disable
  # Turn on once the secret grafana-cloud-sql-sa exists in the monitoring namespace; the
  # staging data source stays unreachable (not Grafana) until then.
  cloudSqlProxy:
    enabled: false
    port: 5433
    secretName: grafana-cloud-sql-sa
