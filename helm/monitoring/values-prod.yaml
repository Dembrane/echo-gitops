# Production configuration for the monitoring stack
clusterIssuerName: "letsencrypt-prod"
domain: "dembrane.com"  # Production domain

# Storage settings
storage:
  storageClassName: "do-block-storage"
  prometheus:
    size: "20Gi"
  loki:
    size: "20Gi"
  grafana:
    size: "10Gi"

# Prometheus settings
prometheus:
  extraArgs:
    - --query.max-concurrency=40
    - --web.max-connections=1024
    - --query.timeout=2m
    - --query.max-samples=100000000
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "4Gi"

# Grafana settings
grafana:
  # This will be overridden by the SealedSecret in production
  adminPassword: "admin"
  resources:
    requests:
      cpu: "200m"
      memory: "750Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Loki settings
loki:
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# Promtail settings
promtail:
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "400m"
      memory: "512Mi"

# Ingress settings - Enable public access via NGINX and TLS
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # Prometheus is read through Grafana and from inside the cluster; true adds its own host.
  prometheusHost: false
  basicAuth:
    enabled: false 

# HTTP Blackbox checks (prod)
httpChecks:
  interval: 30s
  timeout: 5s
  targets:
    - name: api
      url: https://api.dembrane.com/api/health
    - name: ready
      url: https://api.dembrane.com/ready
    - name: dashboard
      url: https://dashboard.dembrane.com/
    - name: portal
      url: https://portal.dembrane.com/

# Dashboards (env-specific variables injected into configmap-grafana-dashboards)
dashboards:
  namespace: "dembrane-web-prod"
# Product dashboards: staging (Google Cloud SQL) is read through the Cloud SQL Auth proxy
# sidecar on localhost, so its OBS_STAGING_DB_HOST is 127.0.0.1:5433 and it needs no TLS of
# its own. The login is the read-only role of sql/grafana-obs-role.sql. Hosts, names, users
# and passwords live in the secret grafana-obs-db (see values.yaml). Production joins the
# list (name: prod, sslmode: require) once its release with the obs views is out and its
# OBS_PROD_DB_* keys are in the secret.
obs:
  environments:
    - name: staging
      sslmode: disable
  # Needs the secret grafana-cloud-sql-sa in the monitoring namespace. The proxy is a
  # container of the Grafana pod: if it cannot start, the pod is not ready and Grafana
  # is unreachable, so set this to false first when Grafana does not come up.
  cloudSqlProxy:
    enabled: true
    port: 5433
    secretName: grafana-cloud-sql-sa
