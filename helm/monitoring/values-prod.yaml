# Production configuration for the monitoring stack
clusterIssuerName: "letsencrypt-prod"
domain: "dembrane.com"  # Production domain

# Storage settings
storage:
  storageClassName: "do-block-storage"
  prometheus:
    size: "20Gi"
  loki:
    size: "20Gi"
  grafana:
    size: "10Gi"

# Prometheus settings
prometheus:
  extraArgs:
    - --query.max-concurrency=40
    - --web.max-connections=1024
    - --query.timeout=2m
    - --query.max-samples=100000000
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "4Gi"

# Grafana settings
grafana:
  # This will be overridden by the SealedSecret in production
  adminPassword: "admin"
  resources:
    requests:
      cpu: "200m"
      memory: "750Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Loki settings
loki:
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# Promtail settings
promtail:
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "400m"
      memory: "512Mi"

# Ingress settings - Enable public access via NGINX and TLS
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  basicAuth:
    enabled: false 

# HTTP Blackbox checks (prod)
httpChecks:
  interval: 30s
  timeout: 5s
  targets:
    - name: api
      url: https://api.dembrane.com/api/health
    - name: ready
      url: https://api.dembrane.com/ready
    - name: dashboard
      url: https://dashboard.dembrane.com/
    - name: portal
      url: https://portal.dembrane.com/

# Dashboards (env-specific variables injected into configmap-grafana-dashboards)
dashboards:
  namespace: "dembrane-web-prod"
# Product dashboards: prod reads its own database directly; staging (Google Cloud SQL) is
# reached through the Cloud SQL Auth proxy sidecar on localhost. Both use the read-only role
# grafana_obs on the obs views only (sql/grafana-obs-role.sql). Passwords: secret
# grafana-obs-db, keys OBS_PROD_DB_PASSWORD and OBS_STAGING_DB_PASSWORD.
obs:
  environments:
    - name: prod
      host: dbr-echo-prod-postgres-do-user-15870604-0.e.db.ondigitalocean.com
      port: 25060
      database: defaultdb
    - name: staging
      host: 127.0.0.1
      port: 5433
      database: echo
      sslmode: disable
  cloudSqlProxy:
    enabled: true
    instance: dembrane-web-staging:europe-west4:echo-staging
    port: 5433
    # A service account key with roles/cloudsql.client on dembrane-web-staging, as key
    # credentials.json of the secret grafana-cloud-sql-sa.
    secretName: grafana-cloud-sql-sa
