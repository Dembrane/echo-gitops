# Configuration for the monitoring stack
clusterIssuerName: "letsencrypt-prod"
domain: "echo-next.dembrane.com"  # Default domain for development

# Storage settings
storage:
  storageClassName: "do-block-storage"
  prometheus:
    size: "10Gi"
  loki:
    size: "20Gi"
  grafana:
    size: "5Gi"

# Prometheus settings
prometheus:
  # Additional Prometheus CLI args
  extraArgs: []
  # Default rollout strategy to avoid PVC multi-attach races
  strategy: Recreate
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Grafana settings
grafana:
  adminPassword: "admin"  # Override this with values-prod.yaml or --set
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

# Loki settings
loki:
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Promtail settings
promtail:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# Ingress settings
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  basicAuth:
    enabled: false

# HTTP Blackbox checks (dev/default)
httpChecks:
  interval: 30s
  timeout: 5s
  targets:
    - name: api
      url: https://api.echo-next.dembrane.com/health
    - name: ready
      url: https://api.echo-next.dembrane.com/ready
    - name: dashboard
      url: https://dashboard.echo-next.dembrane.com/
    - name: portal
      url: https://portal.echo-next.dembrane.com/

# Alerting settings
alerting:
  enabled: true
  slack:
    channel: "#prod-alerts"

# Dashboards (env-specific variables injected into configmap-grafana-dashboards)
dashboards:
  namespace: "dembrane-web-dummy"
# Product dashboards: one Postgres data source per environment, on that database's obs
# views, as the read-only role grafana_obs. The password is key OBS_<NAME>_DB_PASSWORD of
# the secret grafana-obs-db in the monitoring namespace (names are upper-cased). The test
# cluster provisions none: its drafts were added through the Grafana API and it is being
# retired; production holds the prod and staging sources (values-prod.yaml).
obs:
  environments: []
  # Cloud SQL (staging) is reached through the Cloud SQL Auth proxy as a sidecar of Grafana;
  # off here, on in production where the staging data source lives.
  cloudSqlProxy:
    enabled: false
