{{- $c := dict "root" . "component" "api" -}}
# The HTTP API (apps/api). Probes match .github/scripts/deploy-env.sh: /ready (database
# reachable) gates traffic, /health (process up) restarts it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dembrane-web-api
  labels:
    {{- include "dw.labels" $c | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  {{- include "dw.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "dw.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dw.labels" $c | nindent 8 }}
    spec:
      {{- include "dw.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "dw.image" (dict "root" . "app" "api") | quote }}
          imagePullPolicy: IfNotPresent
          {{- include "dw.containerSecurity" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "dw.appEnv" . | nindent 12 }}
            {{- include "dw.secretEnv" (dict "root" . "name" "AUTH_SECRET" "key" "AUTH_SECRET") | nindent 12 }}
            {{- include "dw.secretEnv" (dict "root" . "name" "INVITE_HASH_SECRET" "key" "INVITE_HASH_SECRET") | nindent 12 }}
            {{- include "dw.secretEnv" (dict "root" . "name" "HTTP_PROXY_SECRET" "key" "HTTP_PROXY_SECRET") | nindent 12 }}
            {{- include "dw.mapEnv" .Values.api.env | nindent 12 }}
          volumeMounts:
            {{- include "dw.secretFilesMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
      volumes:
        {{- include "dw.secretFilesVolume" (dict "root" . "gcp" true) | nindent 8 }}
{{ include "dw.service" (dict "root" . "component" "api" "name" "dembrane-web-api") }}
{{ include "dw.hpa" (dict "root" . "component" "api" "name" "dembrane-web-api" "hpa" .Values.api.hpa) }}
{{ include "dw.pdb" (dict "root" . "component" "api" "name" "dembrane-web-api" "minAvailable" .Values.api.pdb.minAvailable) }}
