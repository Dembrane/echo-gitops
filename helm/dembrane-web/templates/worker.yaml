{{- $c := dict "root" . "component" "worker" -}}
# Queued jobs and schedules (apps/worker), on DBOS in Postgres. It serves no HTTP: its health is
# the executor heartbeat the API reports at /ready/worker (checked by the smoke hook), and a
# worker that cannot boot exits, so Kubernetes restarts it. Fixed replicas, no HPA: the prod
# tfvars run a fixed pool, and scaling down mid-job only hands the job to DBOS recovery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dembrane-web-worker
  labels:
    {{- include "dw.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  {{- include "dw.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "dw.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dw.labels" $c | nindent 8 }}
    spec:
      {{- include "dw.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "dw.image" (dict "root" . "app" "worker") | quote }}
          imagePullPolicy: IfNotPresent
          {{- include "dw.containerSecurity" . | nindent 10 }}
          env:
            {{- include "dw.appEnv" . | nindent 12 }}
            {{- include "dw.mapEnv" .Values.worker.env | nindent 12 }}
          volumeMounts:
            {{- include "dw.secretFilesMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "dw.secretFilesVolume" (dict "root" . "gcp" true) | nindent 8 }}
{{- if gt (int .Values.worker.replicas) 1 }}
{{ include "dw.pdb" (dict "root" . "component" "worker" "name" "dembrane-web-worker" "minAvailable" .Values.worker.pdb.minAvailable) }}
{{- end }}
