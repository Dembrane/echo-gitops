# The dummy prod on the DEV cluster (dbr-echo-dev-k8s-cluster), on echo-next's database and
# hostnames. Apply only with the dev cluster's kubeconfig. Automated sync is on: Dembrane/echo
# bumps values-echo-next.yaml on every push to main and this app rolls it out, the way prod will
# take a release after the cutover. To rehearse a CUTOVER.md step by hand, turn it off first
# (argocd app set dembrane-web-dummy --sync-policy none).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dembrane-web-dummy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/dembrane/echo-gitops.git'
    targetRevision: prod-v3
    path: helm/dembrane-web
    helm:
      valueFiles:
        - values-prod.yaml
        - values-echo-next.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dembrane-web-dummy
  syncPolicy:
    automated: { prune: true, selfHeal: true }
